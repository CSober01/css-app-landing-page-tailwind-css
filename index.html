<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Acme App</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Default: Mobile + Tablet */
    #desktop-menu {
      display: none;
    }

    #menu-toggle {
      display: inline-flex;
    }

    @media (min-width: 835px) {
      #desktop-menu {
        display: flex !important;
      }

      #menu-toggle {
        display: none !important;
      }

      #mobile-menu {
        display: none !important;
      }
    }
  </style>
</head>

<body class="bg-[#f8f9fc] font-sans text-slate-800 antialiased">

  <div class="min-h-screen p-3 md:p-6">

    <!-- Navbar -->
    <header class="mb-12 md:mb-20">

      <nav class="relative max-w-none mx-auto bg-white rounded-full
                  px-4 md:px-8 py-4 shadow-sm
                  flex items-center justify-between mb-10 md:mb-16">

        <!-- Logo -->
        <a href="#" class="flex items-center space-x-1">
          <span class="text-xl md:text-2xl font-bold tracking-tight text-slate-900">
            Acme
          </span>
          <span class="w-1.5 h-1.5 bg-indigo-600 rounded-full mb-2"></span>
        </a>

        <!-- Desktop Menu -->
        <div id="desktop-menu" class="items-center space-x-8 text-sm font-medium text-slate-600">

          <a href="#" class="text-indigo-600 font-semibold border-b-2 border-indigo-600 pb-0.5">Home</a>
          <a href="#" class="hover:text-slate-900 transition">Features</a>
          <a href="#" class="hover:text-slate-900 transition">Pricing</a>
          <a href="#" class="hover:text-slate-900 transition">Contact</a>

        </div>

        <!-- Hamburger -->
        <button id="menu-toggle" class="p-2 rounded-lg hover:bg-slate-100 transition"
          aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobile-menu" type="button">

          <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2">

            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />

          </svg>
        </button>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden absolute top-full left-0 right-0 mt-3
                 bg-white rounded-2xl shadow-lg p-4 z-50">

          <div class="flex flex-col justify-center items-center gap-2 text-sm font-medium">

            <a href="#" class="w-full text-center py-3 hover:bg-slate-100 rounded-lg">Home</a>
            <a href="#" class="w-full text-center py-3 hover:bg-slate-100 rounded-lg">Features</a>
            <a href="#" class="w-full text-center py-3 hover:bg-slate-100 rounded-lg">Pricing</a>
            <a href="#" class="w-full text-center py-3 hover:bg-slate-100 rounded-lg">Contact</a>

          </div>
          <h1 class="text-5xl font-extrabold text-slate-900 tracking-tight mb-6">
            Boost Your <span class="text-indigo-600">Product</span>ivity
          </h1>
          <p class="text-lg text-slate-600 mb-10">
            Streamline your workflow with our all-in-one productivity app.
          </p>
          <button class="bg-[#181a20] hover:bg-slate-800 text-white font-medium px-6 py-3 rounded-xl shadow-md transition">
            Start Free Trial
          </button>
        </section>
      </header>

      
      
<!-- ==========================================
         SECTION 3: Developer 3 (Contact Form & Footer)
         ========================================== -->
         <section class="w-full px-4 py-16 flex flex-col items-center gap-16">
        
          <!-- Contact Card Container -->
          <div class="w-full max-w-3xl p-8 md:p-12 flex flex-col items-center bg-white rounded-3xl shadow-sm border border-slate-100">
              
              <!-- Section Header -->
              <h2 class="mb-8 text-3xl md:text-4xl font-bold text-[#1e1b2e] tracking-tight text-center">
                  Get in Touch
              </h2>
  
              <!-- Form -->
              <form action="#" method="POST" class="w-full max-w-md flex flex-col gap-5">
                  
                  <!-- Field: Name -->
                  <div class="flex flex-col gap-2">
                      <label for="name" class="text-sm font-medium text-slate-500">Name</label>
                      <input type="text" 
                             id="name" 
                             name="name" 
                             placeholder="John Doe" 
                             class="w-full px-4 py-3 text-sm bg-white border border-slate-200 rounded-xl outline-none focus:border-slate-400 focus:ring-1 focus:ring-slate-400 transition">
                  </div>
  
                  <!-- Field: Email -->
                  <div class="flex flex-col gap-2">
                      <label for="email" class="text-sm font-medium text-slate-500">Email</label>
                      <input type="email" 
                             id="email" 
                             name="email" 
                             placeholder="john@example.com" 
                             class="w-full px-4 py-3 text-sm bg-white border border-slate-200 rounded-xl outline-none focus:border-slate-400 focus:ring-1 focus:ring-slate-400 transition">
                  </div>
  
                  <!-- Field: Message -->
                  <div class="flex flex-col gap-2">
                      <label for="message" class="text-sm font-medium text-slate-500">Message</label>
                      <textarea id="message" 
                                name="message" 
                                rows="4" 
                                placeholder="Your message..." 
                                class="w-full px-4 py-3 text-sm bg-white border border-slate-200 rounded-xl outline-none focus:border-slate-400 focus:ring-1 focus:ring-slate-400 transition resize-y"></textarea>
                  </div>
  
                  <!-- Submit Button -->
                  <button type="submit" 
                          class="w-full mt-2 py-3.5 text-sm font-semibold text-white bg-[#181623] hover:bg-[#262338] rounded-xl shadow-md transition-colors duration-200">
                      Submit
                  </button>
  
              </form>
  
          </div>
  
          <!-- Footer -->
          <footer class="w-full max-w-5xl pt-4 flex flex-col md:flex-row justify-between items-center gap-4 text-xs font-semibold text-slate-500">
              <!-- Copyright Left -->
              <div>
                  Acme productivity app ©2024
              </div>
  
              <!-- Footer Links Right -->
              <div class="flex items-center gap-6">
                  <a href="#" class="hover:text-slate-800 transition">FAQ</a>
                  <a href="#" class="hover:text-slate-800 transition">Terms</a>
                  <a href="#" class="hover:text-slate-800 transition">AI Policy</a>
                  <a href="#" class="hover:text-slate-800 transition">Pricing</a>
              </div>
          </footer>
  
      </section>

  </body>
</html>
